  - id: e6
    name: TextBox 13
    frame:
      x: 84
      y: 203.35
      width: 1779.1
      height: 731.88
    type: text
    body:
      paragraphs:
        - runs:
            - text: "         When people donate money to an NGO, they often don't know how it was used. They cannot easily see what work was completed, who checked it, or how much money is still unused. This lack of visibility creates a trust problem in charitable giving."
              font:
                kind: family
                family: Times New Roman
              sizePt: 28
          align: justify
        - runs:
            - text: "         This project is a working prototype (demo only) of a donation tracking system that tackles this by dividing a project into milestones, each with its own amount of funding. No real money, wallet or blockchain transaction is involved; contributions and releases are simulated.                   "
              font:
                kind: family
                family: Times New Roman
              sizePt: 28
          align: justify
        - runs:
            - text: "         The NGO submits proof of completed work, independent verifiers review it, and the demo records a milestone's funds as released only after two of three distinct verifiers approve. An activity ledger, stored in the browser, records every step, so donors can follow where their money goes."
              font:
                kind: family
                family: Times New Roman
              sizePt: 28
          align: justify
        - runs: []
          defaultRunStyle:
            font:
              kind: family
              family: Times New Roman
          align: justify
      overflow: visible
      insetsPt:
        top: 3.6
        right: 7.2
        bottom: 3.6
        left: 7.2
