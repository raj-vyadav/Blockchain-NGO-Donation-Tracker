    type: text
    body:
      paragraphs:
        - runs:
            - text: Problem Statement
              weight: 700
          defaultRunStyle:
            font:
              kind: family
              family: Times New Roman
            sizePt: 24
          markerStyle:
            font:
              kind: family
              family: Arial
          bullet:
            kind: character
            character: •
          indentPt: 27
          hangingIndentPt: 27
        - runs:
            - text: "    Every day, people donate to NGOs with good intentions, but once the money is given, it disappears from view. Donors cannot see what work was completed, who checked it, or how much money is still unused. Funds are given on a promise, not on proof, so trust depends only on the NGO's word. What is missing is a way to connect a project's funds to real, verified work."
              font:
                kind: family
                family: Times New Roman
              sizePt: 24
        - runs: []
          defaultRunStyle:
            font:
              kind: family
              family: Times New Roman
            sizePt: 24
        - runs:
            - text: Objective
              weight: 700
          defaultRunStyle:
            font:
              kind: family
              family: Times New Roman
            sizePt: 24
          markerStyle:
            font:
              kind: family
              family: Arial
          bullet:
            kind: character
            character: •
          indentPt: 27
          hangingIndentPt: 27
        - runs:
            - text: "    The objective of this project is to turn a promise into proof. It divides a project into funded milestones, so that funds are tied to specific stages of work. For each milestone, the NGO submits evidence of the completed work, and independent verifiers review it. In this demo, a simulated release is recorded only when two of three distinct verifiers approve; if two verifiers reject the evidence, the milestone needs revision and the funds stay locked until the NGO submits improved proof. Every contribution, evidence submission, vote and release is added to a ledger, so donors can follow the journey of their money."
              font:
                kind: family
                family: Times New Roman
              sizePt: 24
        - runs: []
          defaultRunStyle:
            font:
              kind: family
              family: Times New Roman
            sizePt: 24
      overflow: visible
