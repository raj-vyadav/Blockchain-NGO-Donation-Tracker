  - id: e6
    name: TextBox 4
    frame:
      x: 46.3
      y: 149.76
      width: 1836.74
      height: 945.14
    type: text
    body:
      paragraphs:
        - runs:
            - text: What the Current Website Is
              weight: 700
          defaultRunStyle:
            font:
              kind: family
              family: Times New Roman
            sizePt: 24
          markerStyle:
            font:
              kind: family
              family: Arial
          bullet:
            kind: character
            character: •
          indentPt: 27
          hangingIndentPt: 27
        - runs:
            - text: "     The website is a demo-only prototype: no real money is collected, no wallet is connected and no blockchain transaction takes place. References and fund releases are simulated, and all data, including the ledger, is stored in the browser, so it is not immutable, distributed or independently verifiable. Contributions form one shared pool per project (not tracked rupee by rupee), and the contribution history is community-wide, not a private account. The role selector is not a login, and evidence files are saved as metadata only."
              font:
                kind: family
                family: Times New Roman
              sizePt: 24
        - runs: []
          defaultRunStyle:
            font:
              kind: family
              family: Times New Roman
            sizePt: 24
        - runs:
            - text: Limitations and Future Work
              weight: 700
          defaultRunStyle:
            font:
              kind: family
              family: Times New Roman
            sizePt: 24
          markerStyle:
            font:
              kind: family
              family: Arial
          bullet:
            kind: character
            character: •
          indentPt: 27
          hangingIndentPt: 27
        - runs:
            - text: "     A production version would need secure role-based accounts, a shared backend, real payment handling and a smart contract (for example on Ethereum or Polygon) to enforce the two-of-three release rule. Evidence files would be stored off-chain (for example on IPFS) with a hash recorded on-chain to detect tampering, although a hash cannot prove that the original photograph or claim is true."
              font:
                kind: family
                family: Times New Roman
              sizePt: 24
        - runs: []
          defaultRunStyle:
            font:
              kind: family
              family: Times New Roman
            sizePt: 24
      overflow: visible
      insetsPt:
        top: 3.6
        right: 7.2
        bottom: 3.6
        left: 7.2
